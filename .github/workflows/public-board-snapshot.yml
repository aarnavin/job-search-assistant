name: Refresh public board snapshot

on:
  schedule:
    - cron: "41 16 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: public-board-snapshot
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: node --import tsx scripts/public-board-snapshot.ts
      - name: Commit only real board changes
        run: |
          if git diff --quiet -- data/public-board-snapshot.json; then
            echo 'No public board changes'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/public-board-snapshot.json
          git commit -m 'data: refresh public job board snapshot'
          git push origin HEAD:main
